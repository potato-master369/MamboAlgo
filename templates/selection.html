<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MamboAlgo</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    background: #34344d; 
    margin: 0; height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }
  main {
    font-family: Arial, sans-serif;
    background: #34344d;
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }
  form {
    background: #313131;
    padding: 20px 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 60%;
    max-width: 800px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #ffffff;
  }
  h1 {
    text-align: center;
    color: #ffffff;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #ffffff;
  }
  input[type="text"],
  input[type="file"] {
    display: block;
    margin-bottom: 15px;
    padding: 5px;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #313942;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background: #164c7c;
  }
  nav {
    align-self: flex-start;
    width: 100%; 
  }
  img {
    max-width: calc(100% - 500px);
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>
  <h1>Premier brainrot technology</h1>
  <nav style="background:#3f3f63; display:flex; justify-content:center;">
    <ul style="list-style:none; margin:0; padding:0; display:flex;">
      <li style="position:relative;">
        <a href="/about" style="display:block; padding:14px 20px; color:white; text-decoration:none;">MamboAlgo v1.0.0</a>
      </li>
      <li style="position:relative;">
        <a href="https://github.com/potato-master369" style="display:block; padding:14px 20px; color:white; text-decoration:none;">GitHub: potato-master369</a>
      </li>
    </ul>
  </nav>
  <main>
    <form action="/submit", method="post" enctype="multipart/form-data">

      <img src="data:image/jpg;base64,{{ front_image }}" alt="inline image"> 

    
    <h2>MamboAlgo v1.0.0</h2>
    <label for="file">Choose file:</label> 
    <input type="file" id="file" name="file" placeholder="mambo.jpg"> 
    
    <button type="submit">MAMBOFY!</button>
  </form>
  </main>

</body>
</html>
